<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeastFlow Kitchen KDS | Preparation Queue</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-950 min-h-screen text-slate-100 antialiased flex flex-col">

  <!-- Kitchen Header -->
  <header class="bg-slate-900 border-b-2 border-amber-500 py-3.5 px-4 sticky top-0 z-30 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-extrabold text-base shadow-md">
          <i class="fa-solid fa-fire-burner"></i>
        </div>
        <div>
          <h1 class="text-sm sm:text-base font-extrabold tracking-wide text-white">FeastFlow Kitchen Display System (KDS)</h1>
          <p class="text-[11px] text-amber-400/90 font-medium">Real-Time Kitchen Ticket Preparation Queue</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="loadKitchenKDS()" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-900 border border-slate-700 text-amber-300 font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 shadow-sm transition-colors">
          <i class="fa-solid fa-rotate"></i> Refresh Queue
        </button>
        <button onclick="performStaffLogout()" class="bg-red-950/80 hover:bg-red-900 text-red-200 border border-red-800/80 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-colors">
          <i class="fa-solid fa-power-off text-xs"></i> Logout
        </button>
      </div>
    </div>
  </header>

  <!-- KDS Main View -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-4">
    <div class="flex items-center justify-between bg-slate-900/90 border border-slate-800 px-4 py-3 rounded-2xl">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
        <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Live WebSocket Ticket Stream Active</span>
      </div>
      <div class="text-xs text-amber-400 font-semibold">
        <i class="fa-solid fa-bell mr-1"></i> Audio Alerts Enabled
      </div>
    </div>

    <!-- Active Grid -->
    <div id="kitchen-kds-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      <!-- KDS cards populated by kitchen.js -->
    </div>
  </main>

  <footer class="py-3 text-center text-slate-600 text-xs border-t border-slate-900">
    FeastFlow Kitchen Display System &copy; 2026
  </footer>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/kitchen.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      enforceDashboardProtection('kitchen');
      loadKitchenKDS();
    });
  </script>
</body>
</html>
