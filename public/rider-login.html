<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeastFlow Rider | Mobile Delivery Sign In</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-between text-slate-800 antialiased">

  <!-- Header -->
  <header class="w-full bg-emerald-800 text-white py-3 px-4 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-amber-400 text-emerald-950 flex items-center justify-center font-black text-sm shadow-sm">
          <i class="fa-solid fa-motorcycle"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold text-white">FeastFlow Rider Portal</h1>
          <p class="text-[10px] text-emerald-200">Live GPS & Order Dispatch</p>
        </div>
      </div>
      <a href="/staff/login" class="text-xs text-emerald-200 hover:text-white font-medium">
        Staff Portal &rarr;
      </a>
    </div>
  </header>

  <!-- Login Card Container -->
  <main class="flex-1 w-full max-w-md flex items-center justify-center p-4">
    <div class="w-full bg-white border border-slate-200 rounded-3xl p-7 shadow-lg relative">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-emerald-50 border border-emerald-200 rounded-2xl flex items-center justify-center text-emerald-700 text-2xl mx-auto mb-3 shadow-xs">
          <i class="fa-solid fa-helmet-safety"></i>
        </div>
        <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">Rider Sign In</h2>
        <p class="text-xs text-slate-500 mt-1">Sign in to view your assigned delivery orders.</p>
      </div>

      <form id="rider-login-form" onsubmit="handleRiderPortalLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Rider Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="email" id="rider-email-input" value="rider@restaurant.com" required class="w-full bg-white border border-slate-300 text-slate-800 rounded-xl pl-9 pr-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="password" id="rider-password-input" value="rider123" required class="w-full bg-white border border-slate-300 text-slate-800 rounded-xl pl-9 pr-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 transition-all">
          </div>
        </div>

        <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 active:bg-emerald-900 text-white font-bold py-3 px-4 rounded-xl text-xs sm:text-sm shadow-md transition-all flex items-center justify-center gap-2 mt-6">
          <i class="fa-solid fa-right-to-bracket"></i> Login To Rider Portal
        </button>
      </form>
    </div>
  </main>

  <footer class="py-4 text-center text-slate-400 text-xs">
    FeastFlow Delivery Fleet &copy; 2026
  </footer>

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkRiderSessionRedirect();
    });
  </script>
</body>
</html>
