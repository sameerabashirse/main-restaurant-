<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeastFlow Super Admin | Executive Login</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-between text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">

  <!-- Header -->
  <header class="w-full bg-slate-950/80 border-b border-slate-800 py-3.5 px-4 backdrop-blur-md">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-amber-500 text-slate-950 flex items-center justify-center font-black text-sm shadow-md">
          <i class="fa-solid fa-crown"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold text-white tracking-wide">FeastFlow Executive Portal</h1>
          <p class="text-[10px] text-slate-400">Enterprise Restaurant Governance</p>
        </div>
      </div>
      <a href="/staff/login" class="text-xs text-slate-400 hover:text-amber-400 font-medium transition-colors">
        Staff Login &rarr;
      </a>
    </div>
  </header>

  <!-- Login Card Container -->
  <main class="flex-1 w-full flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800/90 border border-slate-700/80 rounded-3xl p-8 shadow-2xl backdrop-blur-xl relative overflow-hidden">
      <!-- Glow Effect -->
      <div class="absolute -top-24 -left-24 w-48 h-48 bg-red-800/30 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-amber-500/20 rounded-full blur-3xl pointer-events-none"></div>

      <div class="text-center mb-8 relative">
        <div class="w-16 h-16 bg-red-950/80 border border-red-800/60 rounded-2xl flex items-center justify-center text-red-500 text-2xl mx-auto mb-3.5 shadow-inner">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="text-xl font-extrabold text-white tracking-tight">Super Admin Login</h2>
        <p class="text-xs text-slate-400 mt-1">Strictly restricted to executive administrator accounts.</p>
      </div>

      <form id="admin-login-form" onsubmit="handleSuperAdminLogin(event)" class="space-y-4 relative">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Administrator Email</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
            <input type="email" id="admin-email-input" value="admin@restaurant.com" required class="w-full bg-slate-900/90 border border-slate-700 text-white rounded-xl pl-9 pr-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent placeholder:text-slate-600 transition-all shadow-inner">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Secret Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
            <input type="password" id="admin-password-input" value="admin123" required class="w-full bg-slate-900/90 border border-slate-700 text-white rounded-xl pl-9 pr-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent placeholder:text-slate-600 transition-all shadow-inner">
          </div>
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-red-800 to-red-900 hover:from-red-700 hover:to-red-800 active:from-red-900 active:to-red-950 text-white font-bold py-3 px-4 rounded-xl text-xs sm:text-sm shadow-lg shadow-red-950/50 transition-all flex items-center justify-center gap-2 mt-6">
          <i class="fa-solid fa-lock"></i> Login to Executive Admin Portal
        </button>
      </form>
    </div>
  </main>

  <footer class="py-4 text-center text-slate-600 text-xs">
    FeastFlow SaaS Operations Platform &copy; 2026
  </footer>

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAdminSessionRedirect();
    });
  </script>
</body>
</html>
