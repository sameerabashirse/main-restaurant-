<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeastFlow Rider Mobile Portal</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-emerald-800 text-white py-3 px-4 shadow-md sticky top-0 z-30">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-amber-400 text-emerald-950 flex items-center justify-center font-black text-sm shadow-sm">
          <i class="fa-solid fa-motorcycle"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold text-white">Rider Mobile Portal</h1>
          <p class="text-[10px] text-emerald-200">Live GPS & Order Dispatch</p>
        </div>
      </div>
      <button onclick="performRiderLogout()" class="bg-white/10 hover:bg-white/20 active:bg-white/30 border border-white/20 text-white px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5 transition-colors">
        <i class="fa-solid fa-power-off text-[10px]"></i> Logout
      </button>
    </div>
  </header>

  <!-- Main Content Card Container -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col justify-center">
    <div id="rider-order-card" class="w-full">
      <!-- Populated dynamically by rider.js -->
    </div>
  </main>

  <footer class="py-3 text-center text-slate-400 text-xs">
    FeastFlow Delivery Rider App &copy; 2026
  </footer>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/rider.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      enforceDashboardProtection('rider');
    });
  </script>
</body>
</html>
