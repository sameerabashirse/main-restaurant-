<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeastFlow Staff Operations | Login Portal</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-amber-50/40 min-h-screen flex flex-col items-center justify-between text-slate-800 antialiased">

  <!-- Header -->
  <header class="w-full bg-gradient-to-r from-red-900 to-red-950 text-white py-3 px-4 shadow-md">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-amber-400 text-red-950 flex items-center justify-center font-extrabold text-sm shadow-sm">
          <i class="fa-solid fa-utensils"></i>
        </div>
        <div>
          <h1 class="text-sm sm:text-base font-extrabold leading-tight">FeastFlow Staff Operations Portal</h1>
          <p class="text-[11px] text-amber-200/90 font-medium">Managers • Kitchen KDS • Delivery Dispatch</p>
        </div>
      </div>
      <a href="/" class="text-xs text-amber-200 hover:text-white font-medium transition-colors">
        Customer Assistant &rarr;
      </a>
    </div>
  </header>

  <!-- Login Card Container -->
  <main class="flex-1 w-full flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-8 shadow-xl relative">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-red-50 border border-red-200 rounded-2xl flex items-center justify-center text-red-900 text-2xl mx-auto mb-3 shadow-xs">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">Staff Operations Login</h2>
        <p class="text-xs text-slate-500 mt-1">Sign in with assigned staff credentials to access operational tools.</p>
      </div>

      <form id="staff-login-form" onsubmit="handleStaffPortalLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Select Role Preset</label>
          <div class="relative">
            <select id="staff-role-preset" onchange="applyStaffRolePreset(this.value)" class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-red-700 transition-all cursor-pointer">
              <option value="manager">Restaurant Manager - manager@restaurant.com</option>
              <option value="kitchen">Kitchen Staff (KDS) - kitchen@restaurant.com</option>
              <option value="delivery">Delivery Manager - delivery@restaurant.com</option>
              <option value="rider">Delivery Rider - rider@restaurant.com</option>
              <option value="admin">Super Admin - admin@restaurant.com</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Staff Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="email" id="staff-email" value="manager@restaurant.com" required class="w-full bg-white border border-slate-300 text-slate-800 rounded-xl pl-9 pr-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-red-700 transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="password" id="staff-password" value="manager123" required class="w-full bg-white border border-slate-300 text-slate-800 rounded-xl pl-9 pr-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-red-700 transition-all">
          </div>
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-red-900 to-red-800 hover:from-red-800 hover:to-red-700 active:from-red-950 active:to-red-900 text-white font-bold py-3 px-4 rounded-xl text-xs sm:text-sm shadow-md transition-all flex items-center justify-center gap-2 mt-6">
          <i class="fa-solid fa-right-to-bracket"></i> Login To Staff Operations
        </button>
      </form>
    </div>
  </main>

  <footer class="py-4 text-center text-slate-400 text-xs">
    FeastFlow Staff Operations &copy; 2026
  </footer>

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkStaffSessionRedirect();
    });
  </script>
</body>
</html>
